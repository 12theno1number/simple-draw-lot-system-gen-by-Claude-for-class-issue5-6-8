<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抽獎系統 2.0</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#6b6f76;
    --line:#e3dfd6; --accent:#c8402f; --accent-ink:#fff; --soft:#fbeae6; --warn:#9a6700;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17181b; --card:#212226; --ink:#ecebe8; --muted:#a0a3a9;
           --line:#34363b; --accent:#e5604d; --soft:#3a2420; --warn:#d4a72c; }
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important} /* 修正 B9：.row 的 display:flex 會蓋掉 hidden 屬性 */
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  header{padding:24px 16px 8px;max-width:1100px;margin:auto}
  h1{margin:0;font-size:26px;letter-spacing:.04em}
  header p{margin:4px 0 0;color:var(--muted);font-size:14px}
  main{max-width:1100px;margin:auto;padding:12px 16px 40px;
       display:grid;grid-template-columns:1fr 1.2fr;gap:16px}
  @media (max-width:820px){ main{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
  .card h2{margin:0 0 12px;font-size:16px}
  textarea{width:100%;min-height:220px;resize:vertical;border:1px solid var(--line);
           border-radius:10px;padding:10px;font:inherit;font-size:15px;
           background:transparent;color:var(--ink)}
  textarea[readonly]{color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  label.small{font-size:13px;color:var(--muted)}
  input[type=number],select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;
       font:inherit;background:var(--card);color:var(--ink)}
  input[type=number]{width:72px}
  select#prizeSel{flex:1;min-width:0}
  button{border:1px solid var(--line);background:var(--card);color:var(--ink);
         padding:8px 14px;border-radius:9px;font:inherit;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  button.danger{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:14px;text-align:center;
        color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:10px}
  .drop.over{border-color:var(--accent);background:var(--soft)}
  .drop.disabled{opacity:.45;cursor:not-allowed}
  .stage{height:150px;display:flex;align-items:center;justify-content:center;
         border-radius:12px;background:var(--soft);font-size:clamp(28px,6vw,52px);
         font-weight:700;text-align:center;padding:10px;word-break:break-all}
  .stage.rolling{color:var(--muted)}
  .meta{font-size:13px;color:var(--muted);margin-top:8px}
  .summary{font-size:13px;color:var(--muted);margin:4px 0 8px}
  ol#results{margin:10px 0 0;padding-left:28px;max-height:320px;overflow:auto}
  ol#results li{padding:6px 0;border-bottom:1px solid var(--line)}
  .prize{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;
       background:var(--soft);margin-right:6px}
  .sub{color:var(--muted);font-size:12px;margin-left:6px}
  ol#results .t{float:right;color:var(--muted);font-size:12px}
  .msg{font-size:13px;color:var(--accent);min-height:18px;margin-top:6px;white-space:pre-line}
  .msg.warn{color:var(--warn)}
  /* #6 待確認 */
  .stage{position:relative}
  .stage .badge{position:absolute;top:10px;left:12px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px}
  .badge.pending{background:var(--warn);color:#fff}
  .badge.ok{background:#1a7f37;color:#fff}
  .pendingBox{display:none;margin-top:10px;padding:12px;border:2px solid var(--warn);border-radius:12px}
  .pendingBox.show{display:block}
  .pendingBox h3{margin:0 0 6px;font-size:14px;color:var(--warn)}
  .pendingBox ul{list-style:none;margin:0;padding:0}
  .pendingBox li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
  .pendingBox li .who{flex:1;min-width:0}
  .pendingBox .hint{font-size:12px;color:var(--muted);margin-top:6px}
  button.sm{padding:4px 10px;font-size:13px}
  /* #5 取消與重抽 */
  ol#results li .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  ol#results li .main{flex:1;min-width:0}
  ol#results li .t{float:none}
  ol#results li.cancelled .name{text-decoration:line-through;color:var(--muted)}
  .tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:99px;margin-left:6px;border:1px solid var(--line)}
  .tag.redraw{border-color:var(--warn);color:var(--warn)}
  .tag.cancelled{border-color:var(--accent);color:var(--accent)}
  .cancelForm{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;padding:8px;
              border-radius:8px;background:var(--soft);font-size:13px}
  .cancelForm input{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;
              background:var(--card);color:var(--ink);flex:1;min-width:120px}
  .sub2{font-size:12px;color:var(--muted);margin-top:4px}
  .confirm{display:none;gap:8px;align-items:center;margin-top:10px;padding:10px;
           border:1px solid var(--accent);border-radius:10px;background:var(--soft);font-size:14px}
  .confirm.show{display:flex;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>抽獎系統 2.0</h1>
  <p>匯入報名 Excel（含「獎品設定」工作表）或手動輸入名單，選擇獎項後開始抽獎。完全離線可用，紀錄會自動保存在這個瀏覽器。</p>
</header>

<main>
  <!-- 左：資料 -->
  <section class="card">
    <h2>① 參加者與獎項</h2>
    <div class="drop" id="drop">拖曳 Excel (.xlsx) / CSV / TXT 到這裡，或<b>點擊選擇檔案</b>
      <input type="file" id="file" accept=".xlsx,.xlsm,.csv,.txt,.xls" hidden>
    </div>
    <div class="row" id="colPick" hidden>
      <label class="small">工作表</label><select id="sheetSel"></select>
      <label class="small">欄位</label><select id="colSel"></select>
      <label class="small"><input type="checkbox" id="hasHeader" checked> 第一列是標題</label>
    </div>
    <div class="summary" id="summary"></div>
    <textarea id="items" placeholder="手動輸入：每行一位參加者&#10;王小明&#10;陳大文&#10;林美麗&#10;…"></textarea>
    <div class="row">
      <button id="dedupe">移除重複</button>
      <button id="clearItems">清空名單</button>
      <span id="count" style="color:var(--muted);font-size:13px"></span>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <!-- 右：抽獎 -->
  <section class="card">
    <h2>② 抽獎</h2>
    <div class="row" style="margin-top:0">
      <label class="small" for="prizeSel">獎項</label><select id="prizeSel"></select>
    </div>
    <div class="stage" id="stage" style="margin-top:10px">準備好了</div>
    <div class="row">
      <label class="small">一次抽</label><input type="number" id="n" value="1" min="1">
      <label class="small"><input type="checkbox" id="anim" checked> 動畫</label>
    </div>
    <div class="row">
      <button class="primary" id="drawBtn">抽獎</button>
    </div>
    <div class="meta" id="pool"></div>

    <!-- #6：待確認區 -->
    <div class="pendingBox" id="pendingBox">
      <h3>待確認的抽獎結果</h3>
      <ul id="pendingList"></ul>
      <div class="row">
        <button class="primary" id="confirmAllBtn">全部確認</button>
        <button id="discardAllBtn">全部捨棄</button>
      </div>
      <div class="hint">確認後才會列入正式中獎紀錄。待確認期間無法切換獎項、繼續抽獎或匯入名單；重新整理頁面會作廢待確認結果。</div>
    </div>

    <h2 style="margin-top:18px">③ 中獎紀錄</h2>
    <ol id="results"></ol>
    <div class="row">
      <button id="exportBtn">匯出 CSV</button>
      <button id="copyBtn">複製結果</button>
      <button id="resetBtn" class="danger">清除全部紀錄</button>
    </div>
    <!-- 修正 B3：頁面內二次確認，不使用 alert / confirm 彈窗 -->
    <div class="confirm" id="resetConfirm">
      <span id="resetConfirmText"></span>
      <button class="primary" id="resetYes">確定清除</button>
      <button id="resetNo">取消</button>
    </div>
  </section>
</main>

<script src="xlsx-lite.js"></script>
<script src="lottery-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const C = LotteryCore;
const itemsEl = $('items');

let state = C.createState();
let book = null;      // 無法自動辨識時，供手動選欄位用
let rolling = false;  // 動畫進行中
let storageOk = true;

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function say(t, warn = false){ $('msg').textContent = t; $('msg').classList.toggle('warn', warn); }

/* ---------- 保存（G3） ---------- */
function save(){
  try { localStorage.setItem(C.STORAGE_KEY, C.serialize(state)); storageOk = true; }
  catch { storageOk = false; }
}
function load(){
  try { return C.deserialize(localStorage.getItem(C.STORAGE_KEY)); }
  catch { storageOk = false; return null; }
}

/* ---------- 鎖定規則（修正 B1、B2） ----------
 * 動畫中：所有會改資料的操作都停用
 * 已有中獎紀錄：不能換名單（避免參加者 ID 對不上舊紀錄），需先清除紀錄 */
const hasRecords = () => state.records.length > 0;
const dataLocked = () => rolling || hasRecords();
// #6（Q2）：動畫中或有待確認結果時，不能切換獎項、繼續抽獎、清除紀錄
const busy = () => rolling || C.hasPending(state);
const official = () => state.records.filter(r => r.status !== 'pending');

/* ---------- 名單（手動模式） ---------- */
function setManual(text){
  state.source = 'manual';
  state.participants = C.participantsFromLines(text);
  state.prizes = [C.defaultPrize(state.participants.length)];
}
itemsEl.addEventListener('input', () => {
  if (dataLocked()) return render(); // 理論上 readonly 擋住了，這裡再保險一次
  setManual(itemsEl.value); book = null; $('colPick').hidden = true;
  save(); render(false);
});
$('dedupe').onclick = () => {
  if (dataLocked()) return;
  const seen = new Set(), out = [];
  for (const s of itemsEl.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean)) if (!seen.has(s)) { seen.add(s); out.push(s); }
  itemsEl.value = out.join('\n'); setManual(itemsEl.value); save(); render();
};
$('clearItems').onclick = () => {
  if (dataLocked()) return;
  state = C.createState(); book = null; $('colPick').hidden = true; save(); render(); say('');
};

/* ---------- 檔案匯入 ---------- */
const drop = $('drop'), fileIn = $('file');
drop.onclick = () => { if (!dataLocked()) fileIn.click(); };
drop.ondragover = e => { e.preventDefault(); if (!dataLocked()) drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (!dataLocked() && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]); };
fileIn.onchange = () => { if (fileIn.files[0]) loadFile(fileIn.files[0]); fileIn.value = ''; };

async function loadFile(f){
  if (dataLocked()) return say('已有中獎紀錄，如要更換名單請先「清除全部紀錄」。');
  const ext = f.name.split('.').pop().toLowerCase();
  try{
    const buf = await f.arrayBuffer();
    if (ext === 'xls') return say('不支援舊版 .xls，請在 Excel 用「另存新檔」存成 .xlsx 或 CSV 再匯入。');
    if (ext === 'txt'){
      book = null; $('colPick').hidden = true;
      itemsEl.value = XlsxLite.decodeText(buf); setManual(itemsEl.value); save(); render();
      return say(`已載入 ${f.name}`);
    }
    const wb = ext === 'csv'
      ? { SheetNames: [f.name], data: { [f.name]: XlsxLite.parseCSV(XlsxLite.decodeText(buf)) } }
      : await XlsxLite.readXlsx(buf);
    if (!wb.SheetNames.length) return say('檔案中沒有可讀的工作表');

    // 先嘗試自動辨識「參加者」與「獎品設定」工作表
    const got = C.fromWorkbook(wb);
    if (got && got.participants.length){
      book = null; $('colPick').hidden = true;
      state = { ...C.createState(), source: 'workbook', participants: got.participants, prizes: got.prizes };
      save(); render();
      const lines = [`已載入 ${f.name}：${got.participants.length} 位參加者（${got.peopleSheet}）、${got.prizes.length} 個獎項${got.prizeSheet ? `（${got.prizeSheet}）` : ''}`];
      return say(lines.concat(got.warnings).join('\n'), got.warnings.length > 0);
    }
    // 辨識失敗 → 退回上週的手動選欄位
    book = wb;
    $('sheetSel').innerHTML = book.SheetNames.map(n => `<option>${esc(n)}</option>`).join('');
    $('colPick').hidden = false;
    fillColumns();
    say(`已載入 ${f.name}，找不到「姓名」欄，請手動選擇工作表與欄位`, true);
  }catch(err){
    say('檔案讀取失敗：' + err.message);
  }
}

const sheetRows = () => book ? (book.data[$('sheetSel').value] || []) : [];
function fillColumns(){
  const rows = sheetRows();
  const width = Math.max(1, ...rows.map(r => r.length));
  const head = rows[0] || [];
  $('colSel').innerHTML = Array.from({length: width}, (_, i) => {
    const letter = XlsxLite.colName(i);
    const label = $('hasHeader').checked && String(head[i] ?? '').trim() !== '' ? `${letter}：${head[i]}` : letter;
    return `<option value="${i}">${esc(label)}</option>`;
  }).join('');
  applyColumn();
}
function applyColumn(){
  if (dataLocked() || !book) return;
  const rows = sheetRows(), c = +$('colSel').value || 0;
  const body = $('hasHeader').checked ? rows.slice(1) : rows;
  itemsEl.value = body.map(r => String(r[c] ?? '').trim()).filter(Boolean).join('\n');
  setManual(itemsEl.value); save(); render();
}
$('sheetSel').onchange = fillColumns;
$('colSel').onchange = applyColumn;
$('hasHeader').onchange = () => { if (book) fillColumns(); };

/* ---------- 抽獎 ---------- */
const currentPrize = () => $('prizeSel').value;
const prizeName = id => (state.prizes.find(p => p.id === id) || {}).name || id;

function setStage(text, badge){
  $('stage').innerHTML = (badge === 'pending' ? '<span class="badge pending">待確認</span>' :
                          badge === 'redraw' ? '<span class="badge pending">重抽・待確認</span>' :
                          badge === 'ok' ? '<span class="badge ok">已確認</span>' : '') + esc(text);
}

// 共用的抽獎動畫：播完才呼叫 finish（動畫期間 rolling = true，所有寫入操作都停用）
function animate(pool, finish){
  if (!$('anim').checked || !pool.length) return finish();
  rolling = true; render();
  $('stage').classList.add('rolling');
  let t = 0;
  const tick = () => {
    $('stage').textContent = pool[C.cryptoRandInt(pool.length)].name;
    if (++t < 22) setTimeout(tick, 40 + t * 6); else finish();
  };
  tick();
}
function endRolling(){ rolling = false; $('stage').classList.remove('rolling'); }

function draw(){
  if (busy()) return;
  const prizeId = currentPrize();
  const n = Math.max(1, parseInt($('n').value) || 1);
  const picks = C.pick(state, prizeId, n);
  if (!picks.length) return say('此獎項已沒有名額或可抽的人');
  if (picks.length < n) say(`此獎項只能再抽 ${picks.length} 人，已自動調整`, true); else say('');

  animate(C.eligible(state, prizeId), () => {
    endRolling();
    try { C.commitDraw(state, prizeId, picks, new Date()); }
    catch (err) { render(); return say('抽獎失敗：' + err.message); }
    save();
    setStage(picks.length > 3 ? `抽出 ${picks.length} 人` : picks.map(p => p.name).join('、'), 'pending');
    render();
  });
}

/* ---------- #5 重抽 ---------- */
function redraw(cancelledId){
  if (busy()) return;
  let picks;
  try { picks = C.pickRedraw(state, cancelledId); } catch (err) { return say(err.message); }
  const c = state.records.find(r => r.id === cancelledId);
  $('prizeSel').value = c.prizeId; // 切到該獎項，讓主持人看清楚是在補哪個獎
  say(`重抽：補位「${c.who.name}」的 ${prizeName(c.prizeId)}`);
  animate(C.eligible(state, c.prizeId), () => {
    endRolling();
    try { C.commitRedraw(state, cancelledId, picks, new Date()); }
    catch (err) { render(); return say('重抽失敗：' + err.message); }
    save();
    setStage(picks[0].name, 'redraw');
    render();
  });
}
$('drawBtn').onclick = draw;
$('prizeSel').onchange = () => { if (busy()) return render(); render(); };

/* ---------- #6 確認 / 捨棄 ---------- */
function act(fn, okMsg){
  if (rolling) return;
  try { fn(); } catch (err) { return say(err.message); }
  save(); render(); if (okMsg) say(okMsg);
}
$('pendingList').onclick = e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'confirm') act(() => {
    const r = C.confirm(state, id, new Date());
    if (!C.hasPending(state)) setStage(r.who.name, 'ok');
  }, '');
  if (b.dataset.act === 'discard') act(() => {
    C.discard(state, id);
    if (!C.hasPending(state)) setStage('已捨棄，可重新抽獎');
  }, '');
};
$('confirmAllBtn').onclick = () => act(() => {
  const done = C.confirmAll(state, new Date());
  setStage(done.length > 3 ? `已確認 ${done.length} 人` : done.map(r => r.who.name).join('、'), 'ok');
}, '');
$('discardAllBtn').onclick = () => act(() => {
  const gone = C.discardAll(state);
  setStage('已捨棄，可重新抽獎'); say(`已捨棄 ${gone.length} 筆待確認結果，名額已恢復`);
});

/* ---------- #5 取消中獎 ---------- */
let cancelOpenId = null; // 目前展開取消表單的紀錄
$('results').onclick = e => {
  const b = e.target.closest('button[data-act]'); if (!b || rolling) return;
  const id = b.dataset.id, li = b.closest('li');
  switch (b.dataset.act){
    case 'cancel-open': cancelOpenId = id; render(); break;
    case 'cancel-back': cancelOpenId = null; render(); break;
    case 'cancel-do': {
      const reason = li.querySelector('select').value, note = li.querySelector('input').value;
      if (reason === '其他' && !note.trim()) return say('選擇「其他」時請簡單說明原因');
      act(() => {
        const r = C.cancel(state, id, reason, note, new Date());
        cancelOpenId = null;
        say(`已取消「${r.who.name}」的${prizeName(r.prizeId)}，名額已退回 1 個，可按「重抽」補位`);
      });
      break;
    }
    case 'redraw': redraw(id); break;
  }
};
$('results').onchange = e => { // 選「其他」才需要備註
  if (e.target.matches('select')) e.target.closest('li').querySelector('input').hidden = e.target.value !== '其他';
};

/* ---------- 清除紀錄（修正 B3：二次確認） ---------- */
$('resetBtn').onclick = () => {
  if (busy() || !hasRecords()) return;
  $('resetConfirmText').textContent = `確定要清除全部 ${official().length} 筆中獎紀錄嗎？清除後無法復原，建議先匯出 CSV。`;
  $('resetConfirm').classList.add('show');
};
$('resetNo').onclick = () => $('resetConfirm').classList.remove('show');
$('resetYes').onclick = () => {
  $('resetConfirm').classList.remove('show');
  if (busy()) return;
  C.resetRecords(state); save();
  $('stage').textContent = '準備好了'; render(); say('已清除全部中獎紀錄');
};

/* ---------- 匯出 ---------- */
$('exportBtn').onclick = () => {
  if (!official().length) return say('還沒有正式中獎紀錄可以匯出');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([C.toCSV(state)], {type: 'text/csv'}));
  const d = new Date(), p = n => String(n).padStart(2, '0');
  a.download = `中獎名單_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('copyBtn').onclick = async () => {
  const name = id => (state.prizes.find(p => p.id === id) || {}).name || '';
  try{ await navigator.clipboard.writeText(official().filter(r => r.status === 'confirmed').map((r, i) => `${i + 1}. ${name(r.prizeId)} ${r.who.name}`).join('\n')); say('已複製'); }
  catch{ say('無法複製，請手動選取'); }
};

/* ---------- 畫面 ---------- */
let lastCount = 0;
const whoSub = w => esc([w.department, w.grade].filter(Boolean).join(' '));
// #5：每筆紀錄依狀態顯示不同的操作
function recordItem(r){
  const b = busy();
  const tags = [];
  if (r.isRedraw){
    const orig = state.records.find(x => x.id === r.replacesId);
    tags.push(`<span class="tag redraw">重抽${orig ? `・補 ${esc(orig.who.name)}` : ''}</span>`);
  }
  let actions = '', extra = '';
  if (r.status === 'confirmed'){
    if (cancelOpenId === r.id){
      extra = `<div class="cancelForm">取消原因
        <select>${C.CANCEL_REASONS.map(x => `<option>${esc(x)}</option>`).join('')}</select>
        <input type="text" placeholder="請說明原因" maxlength="60" hidden>
        <button class="sm primary" data-act="cancel-do" data-id="${esc(r.id)}">確定取消中獎</button>
        <button class="sm" data-act="cancel-back" data-id="${esc(r.id)}">返回</button></div>`;
    } else {
      actions = `<button class="sm danger" data-act="cancel-open" data-id="${esc(r.id)}" ${b ? 'disabled' : ''}>取消中獎</button>`;
    }
  } else if (r.status === 'cancelled'){
    tags.push(`<span class="tag cancelled">已取消：${esc(r.cancelReason)}${r.cancelNote ? `（${esc(r.cancelNote)}）` : ''}</span>`);
    const rep = C.replacementOf(state, r.id);
    if (rep) extra = `<div class="sub2">已由 ${esc(rep.who.name)} 補位${rep.status === 'pending' ? '（待確認）' : ''}</div>`;
    else {
      const why = C.canRedraw(state, r.id);
      actions = `<button class="sm primary" data-act="redraw" data-id="${esc(r.id)}" ${why || rolling ? 'disabled' : ''} title="${esc(why)}">重抽</button>`;
      if (why && !C.hasPending(state)) extra = `<div class="sub2">${esc(why)}</div>`;
    }
  }
  return `<li class="${r.status}"><div class="line"><span class="main"><span class="prize">${esc(prizeName(r.prizeId))}</span>` +
    `<span class="name">${esc(r.who.name)}</span><span class="sub">${whoSub(r.who)}</span>${tags.join('')}</span>` +
    `${actions}<span class="t">${esc(r.status === 'cancelled' ? r.cancelledAt : r.drawnAt)}</span></div>${extra}</li>`;
}

function render(syncText = true){
  const locked = dataLocked();

  // ① 名單
  if (syncText && state.source !== 'manual'){
    itemsEl.value = state.participants.map(p =>
      [p.name, [p.department, p.grade].filter(Boolean).join(' ')].filter(Boolean).join('　')).join('\n');
  }
  itemsEl.readOnly = locked || state.source === 'workbook';
  $('dedupe').disabled = locked || state.source === 'workbook';
  $('clearItems').disabled = locked || !state.participants.length;
  drop.classList.toggle('disabled', locked);
  $('sheetSel').disabled = $('colSel').disabled = $('hasHeader').disabled = locked;
  $('count').textContent = `共 ${state.participants.length} 位參加者`;
  $('summary').textContent =
    state.source === 'workbook' ? '名單來自匯入的 Excel（唯讀）' :
    state.source === 'manual' && state.participants.length ? '手動名單，使用單一獎項「抽籤」' : '';
  if (hasRecords()) $('summary').textContent += (($('summary').textContent ? '；' : '') + '已有中獎紀錄，名單已鎖定');

  // ② 獎項
  const keep = currentPrize();
  $('prizeSel').innerHTML = state.prizes.map(p =>
    `<option value="${esc(p.id)}">${esc(p.name)}（剩 ${C.remainingQuota(state, p.id)} / ${p.quota}）</option>`).join('');
  if (state.prizes.some(p => p.id === keep)) $('prizeSel').value = keep;
  else { const open = state.prizes.find(p => C.maxDrawable(state, p.id) > 0); if (open) $('prizeSel').value = open.id; }
  $('prizeSel').disabled = busy() || !state.prizes.length;

  const pid = currentPrize();
  const prize = state.prizes.find(p => p.id === pid);
  const can = prize ? C.maxDrawable(state, pid) : 0;
  $('drawBtn').disabled = busy() || can < 1;
  $('n').disabled = busy();
  $('pool').textContent = prize
    ? `剩餘名額 ${C.remainingQuota(state, pid)}，可抽人數 ${C.eligible(state, pid).length}` + (prize.note ? `｜${prize.note}` : '')
    : '請先匯入或輸入參加者';

  // ③ 紀錄
  const list = official();
  const keepScroll = $('results').scrollTop, grew = list.length !== lastCount;
  $('results').innerHTML = list.map(recordItem).join('');
  $('results').scrollTop = grew ? $('results').scrollHeight : keepScroll; // 有新紀錄才捲到底
  lastCount = list.length;
  $('resetBtn').disabled = busy() || !hasRecords();
  $('exportBtn').disabled = $('copyBtn').disabled = rolling || !official().length;

  // #6 待確認區
  const pend = C.pendingRecords(state);
  $('pendingBox').classList.toggle('show', pend.length > 0 && !rolling);
  $('pendingList').innerHTML = pend.map(r =>
    `<li><span class="who"><span class="prize">${esc(prizeName(r.prizeId))}</span>${r.isRedraw ? '<span class="tag redraw">重抽</span>' : ''} <b>${esc(r.who.name)}</b>` +
    `<span class="sub">${esc([r.who.department, r.who.grade].filter(Boolean).join(' '))}</span></span>` +
    `<button class="sm primary" data-act="confirm" data-id="${esc(r.id)}">確認</button>` +
    `<button class="sm" data-act="discard" data-id="${esc(r.id)}">捨棄</button></li>`).join('');
}

/* ---------- 啟動：還原上次的資料 ---------- */
const restored = load();
if (restored){
  state = restored;
  if (state.source === 'manual') itemsEl.value = state.participants.map(p => p.name).join('\n');
}
render();
if (!storageOk) say('這個瀏覽器無法保存資料，重新整理後紀錄會消失，請記得匯出 CSV。', true);
else if (restored && restored.records.length) say(`已還原上次的 ${restored.records.length} 筆中獎紀錄`);
</script>
</body>
</html>
